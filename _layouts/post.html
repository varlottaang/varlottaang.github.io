---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← Back to Blog</a>
  <header class="post-header">
    <h1 class="heading heading-1" style="color: {{ page.title | title_color }}">{{ page.title }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.substack_url %} · <a href="{{ page.substack_url }}" target="_blank" rel="noopener noreferrer">Read on Substack ↗</a>{% endif %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ site.socials | where: 'name', 'Substack' | map: 'url' | first }}" target="_blank" rel="noopener noreferrer">Subscribe on Substack ↗</a>
  </footer>
</article>
