name: Fetch Substack Posts

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Substack posts
        run: node scripts/fetch-substack-posts.js

      - name: Check for new posts
        id: changes
        run: |
          if [[ $(git status -s | grep -c "??") -gt 0 ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with new drafts
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "import: add new substack post drafts"
          title: "🦉 New Substack posts (drafts)"
          body: |
            New posts from your Substack have been imported as drafts.

            Please review each post:
            - Check formatting and content
            - Add tags if desired
            - Change `draft: false` when ready to publish
            - Delete if you don't want to publish

            Once you're happy, merge this PR to publish the posts to your blog.
          branch: auto/substack-posts-${{ github.run_id }}
          delete-branch: true
