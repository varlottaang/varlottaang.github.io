collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: description
        label: Description
        widget: text
        required: true
        hint: "SEO description (160 chars recommended)"
      - name: pubDatetime
        label: Published Date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ss.000Z"
        required: true
      - name: modDatetime
        label: Last Modified Date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ss.000Z"
        required: false
        default: ""
      - name: tags
        label: Tags
        widget: list
        field:
          label: Tag
          widget: string
        default: []
        required: false
      - name: draft
        label: Draft
        widget: boolean
        default: true
      - name: featured
        label: Featured
        widget: boolean
        default: false
      - name: source
        label: Source
        widget: select
        options:
          - label: Substack
            value: substack
          - label: Patreon
            value: patreon
          - label: Personal
            value: personal
        default: ""
        required: false
      - name: originalUrl
        label: Original URL
        widget: string
        default: ""
        required: false
      - name: body
        label: Content
        widget: markdown
        required: true

media:
  media_folder: src/assets/blog
  public_path: /assets/blog

backend:
  name: github
  repo: varlottaang/varlottaang.github.io
  branch: main
  base_url: https://pagescms.org
  auth_endpoint: api/auth
